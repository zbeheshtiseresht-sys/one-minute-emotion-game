<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Minute, One Color</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f4f4f4;display:flex;align-items:center;justify-content:center;transition:background 1.2s ease;padding:20px}.card{width:min(680px,100%);background:rgba(255,255,255,.9);border-radius:24px;padding:34px;text-align:center;box-shadow:0 12px 45px rgba(0,0,0,.12)}h1{margin-top:0}.timer{font-size:64px;font-weight:bold;margin:20px 0}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:12px;padding:14px 20px;font-size:16px;cursor:pointer;background:#222;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.result{margin-top:22px;text-align:left;white-space:pre-wrap;line-height:1.7}.status{min-height:28px}
</style>
</head>
<body>
<div class="card">
<h1>One Minute, One Color</h1>
<p>Talk freely for one minute about how you feel.</p>
<div class="timer" id="timer">01:00</div>
<p class="status" id="status">Ready to listen.</p>
<div class="buttons">
<button id="startBtn">Start recording</button>
<button id="stopBtn" disabled>Stop & Analyze</button>
<button id="resetBtn">Play again</button>
</div>
<div class="result" id="result"></div>
</div>
<script>
let recorder=null, stream=null, chunks=[], interval=null, remaining=60;
const $=id=>document.getElementById(id);
function updateTimer(){const m=Math.floor(remaining/60),s=remaining%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function cleanup(){if(interval){clearInterval(interval);interval=null;}if(stream){stream.getTracks().forEach(track=>track.stop());stream=null;}}
$('startBtn').addEventListener('click', async()=>{
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true}); chunks=[]; remaining=60; updateTimer();
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size) chunks.push(e.data)};
  recorder.onstop=analyzeAudio;
  recorder.start(); $('status').textContent='Listening... Speak freely.'; $('startBtn').disabled=true; $('stopBtn').disabled=false;
  interval=setInterval(()=>{remaining--;updateTimer();if(remaining<=0) stopRecording();},1000);
 }catch(err){$('status').textContent='Microphone permission is required: '+err.message;}
});
function stopRecording(){if(!recorder || recorder.state==='inactive') return; $('stopBtn').disabled=true;$('status').textContent='Recording finished. Analyzing...';clearInterval(interval);interval=null;recorder.stop();}
$('stopBtn').addEventListener('click',stopRecording);
async function analyzeAudio(){
 cleanup();
 try{
  const blob=new Blob(chunks,{type:chunks[0]?.type||'audio/webm'}); const form=new FormData(); form.append('audio',blob,'voice.webm');
  const res=await fetch('/api/analyze',{method:'POST',body:form}); let data; try{data=await res.json()}catch{throw new Error('Server returned an invalid response.')}
  if(!res.ok || data.error) throw new Error(data.error||'Analysis failed.');
  document.body.style.background=data.color; $('status').textContent='Your color has been revealed.';
  $('result').innerHTML='<b>Emotion:</b> '+escapeHtml(data.emotion)+'<br><b>Confidence:</b> '+escapeHtml(String(data.confidence))+'%<br><br><b>What you said:</b><br>'+escapeHtml(data.transcript);
 }catch(err){$('status').textContent='Error: '+err.message;$('startBtn').disabled=false;}
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('resetBtn').addEventListener('click',()=>location.reload());
</script>
</body>
</html>
